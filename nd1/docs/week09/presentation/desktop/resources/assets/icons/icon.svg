<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#162846"/>
      <stop offset="100%" stop-color="#0a1424"/>
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#087e98"/>
      <stop offset="50%" stop-color="#00d4f5"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="spec" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#087e98"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" stroke="#26436e" stroke-width="6"/>

  <!-- Subtle oscilloscope grid lines -->
  <g stroke="#1d3557" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6">
    <line x1="64" y1="140" x2="448" y2="140"/>
    <line x1="64" y1="200" x2="448" y2="200"/>
    <line x1="64" y1="260" x2="448" y2="260"/>
    <line x1="64" y1="320" x2="448" y2="320"/>
    <line x1="64" y1="380" x2="448" y2="380"/>
    <line x1="140" y1="80" x2="140" y2="440"/>
    <line x1="220" y1="80" x2="220" y2="440"/>
    <line x1="300" y1="80" x2="300" y2="440"/>
    <line x1="380" y1="80" x2="380" y2="440"/>
  </g>

  <!-- Central axis -->
  <line x1="64" y1="260" x2="448" y2="260" stroke="#33537d" stroke-width="2"/>

  <!-- Discrete Spectrum FFT Bins (right side) -->
  <g fill="url(#spec)" opacity="0.9">
    <rect x="310" y="220" width="16" height="80" rx="4"/>
    <rect x="336" y="160" width="16" height="140" rx="4"/>
    <rect x="362" y="110" width="16" height="190" rx="4" filter="url(#glow)"/>
    <rect x="388" y="190" width="16" height="110" rx="4"/>
    <rect x="414" y="235" width="16" height="65" rx="4"/>
  </g>

  <!-- Continuous Analog Signal Waveform -->
  <path d="M 64 260 C 95 130, 135 130, 165 260 C 195 390, 235 390, 265 260 C 285 180, 305 180, 325 260"
        fill="none" stroke="url(#wave)" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Sampling points (Discrete Time Ts dots) -->
  <circle cx="115" cy="168" r="7" fill="#f59e0b" stroke="#fff" stroke-width="2" filter="url(#glow)"/>
  <circle cx="165" cy="260" r="7" fill="#f59e0b" stroke="#fff" stroke-width="2"/>
  <circle cx="215" cy="352" r="7" fill="#f59e0b" stroke="#fff" stroke-width="2" filter="url(#glow)"/>
  <circle cx="265" cy="260" r="7" fill="#f59e0b" stroke="#fff" stroke-width="2"/>

  <!-- Badge Top: ND01 Signal Lab -->
  <text x="68" y="92" fill="#38bdf8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="28" font-weight="800" letter-spacing="3">ND01</text>
  <text x="165" y="92" fill="#94a3b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="1">/ W09</text>

  <!-- Badge Bottom: Seeing the Signal -->
  <text x="68" y="432" fill="#e2e8f0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="1.5">SEEING THE SIGNAL</text>
</svg>